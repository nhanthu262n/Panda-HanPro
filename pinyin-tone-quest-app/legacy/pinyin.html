<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Interactive Pinyin Chart — PandaHán Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
/* ── Reset & base ── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#ec4899;--pink-l:#f9a8d4;--pink-ll:#fce7f3;--pink-lll:#fdf2f8;
  --purple:#a855f7;--purple-l:#e9d5ff;
  --rose:#f43f5e;
  --white:#ffffff;
  --gray-8:#1f2937;--gray-6:#4b5563;--gray-4:#9ca3af;--gray-2:#f3f4f6;
}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--pink-lll);min-height:100vh;overflow-x:hidden}

/* ── Sakura ── */
@keyframes petal-fall{
  0%{transform:translateY(-60px) rotate(0deg);opacity:0}
  6%{opacity:1}
  88%{opacity:.6}
  100%{transform:translateY(105vh) rotate(var(--spin)) translateX(var(--drift));opacity:0}
}
.petal{position:fixed;top:0;pointer-events:none;z-index:0;animation:petal-fall var(--dur) var(--delay) linear infinite}
.petal svg{width:100%;height:100%}

/* ── Animated gradient bg ── */
@keyframes grad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
body{
  background:linear-gradient(135deg,#fce7f3,#fdf2f8,#ede9fe,#dbeafe,#fce7f3);
  background-size:300% 300%;
  animation:grad 10s ease infinite;
}

/* ── Layout ── */
.app{position:relative;z-index:1;min-height:100vh}

/* ── Header ── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 32px;
  background:rgba(255,255,255,0.82);
  backdrop-filter:blur(14px);
  border-bottom:1.5px solid var(--pink-ll);
  position:sticky;top:0;z-index:50;
  box-shadow:0 2px 16px rgba(236,72,153,.07);
}
.logo{display:flex;align-items:center;gap:12px}
.logo-badge{
  width:44px;height:44px;border-radius:14px;
  background:linear-gradient(135deg,rgba(236,72,153,.15),rgba(168,85,247,.15));
  border:2px solid var(--pink-ll);
  display:flex;align-items:center;justify-content:center;font-size:24px;
}
.logo-text{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.15rem}
.logo-text span{background:linear-gradient(135deg,#ec4899,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-sub{font-size:.72rem;color:var(--gray-4);font-weight:600;margin-top:1px}
.header-right{display:flex;align-items:center;gap:10px}
.btn-tone{
  padding:6px 14px;border-radius:20px;font-size:.78rem;font-weight:800;
  border:2px solid transparent;cursor:pointer;transition:all .2s;
  font-family:'Nunito',sans-serif;
}
.btn-tone.active{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(236,72,153,.35)}
.btn-tone:not(.active){background:var(--pink-ll);color:var(--pink);border-color:var(--pink-l)}
.btn-tone:not(.active):hover{background:var(--pink-l);transform:scale(1.05)}

/* ── Hero ── */
.hero{padding:36px 32px 28px;max-width:1100px;margin:0 auto}
.hero h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.75rem;color:var(--gray-8);margin-bottom:6px}
.hero h1 span{background:linear-gradient(135deg,#ec4899,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--gray-4);font-weight:600;font-size:.9rem}

/* ── Search ── */
.search-wrap{padding:0 32px 24px;max-width:1100px;margin:0 auto}
.search-box{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.9);
  border:2px solid var(--pink-ll);
  border-radius:18px;padding:11px 18px;
  box-shadow:0 2px 12px rgba(236,72,153,.07);
  transition:border-color .2s;max-width:420px;
}
.search-box:focus-within{border-color:var(--pink-l)}
.search-box svg{flex-shrink:0;color:var(--pink-l)}
.search-box input{border:none;outline:none;background:transparent;font-size:.88rem;font-weight:700;color:var(--gray-8);width:100%;font-family:'Nunito',sans-serif}
.search-box input::placeholder{color:#e0a0bf;font-weight:600}

/* ── Tone legend ── */
.tone-legend{
  display:flex;gap:10px;flex-wrap:wrap;
  padding:0 32px 20px;max-width:1100px;margin:0 auto;
}
.tone-pill{
  display:flex;align-items:center;gap:7px;
  padding:6px 14px 6px 10px;border-radius:20px;
  background:rgba(255,255,255,.85);
  border:1.5px solid;font-size:.78rem;font-weight:800;cursor:pointer;
  transition:all .18s;
}
.tone-pill:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.09)}
.tone-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ── Main table area ── */
.table-wrap{padding:0 32px 48px;max-width:1100px;margin:0 auto;overflow-x:auto}

/* ── Section header ── */
.section-header{
  display:flex;align-items:center;gap:12px;
  margin-bottom:16px;padding:14px 20px;
  border-radius:18px;
  background:linear-gradient(135deg,var(--pink-ll),var(--purple-l));
  border:1.5px solid var(--pink-l);
}
.section-icon{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;
  background:linear-gradient(135deg,var(--pink),var(--purple));box-shadow:0 3px 10px rgba(236,72,153,.3)}
.section-title{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1rem;color:var(--gray-8)}
.section-sub{font-size:.75rem;color:var(--gray-4);font-weight:600;margin-top:1px}

/* ── Grid of cells ── */
.pinyin-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px}
.initial-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}

/* ── Pinyin cell ── */
.cell{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:72px;height:72px;border-radius:16px;cursor:pointer;
  background:rgba(255,255,255,.9);
  border:2px solid var(--pink-ll);
  transition:all .16s cubic-bezier(.22,1,.36,1);
  position:relative;overflow:hidden;
  box-shadow:0 2px 10px rgba(236,72,153,.06);
  user-select:none;
}
.cell::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.5),transparent);
  opacity:0;transition:opacity .2s;pointer-events:none;
}
.cell:hover{
  transform:translateY(-3px) scale(1.06);
  border-color:var(--pink-l);
  box-shadow:0 6px 20px rgba(236,72,153,.2);
}
.cell:hover::before{opacity:1}
.cell:active{transform:scale(.97)}
.cell.playing{
  background:linear-gradient(135deg,var(--pink),var(--purple));
  border-color:transparent;
  box-shadow:0 6px 20px rgba(236,72,153,.45);
  transform:translateY(-3px) scale(1.08);
}
.cell.playing .cell-pinyin,.cell.playing .cell-tone{color:#fff!important}
.cell.playing .cell-hanzi{color:rgba(255,255,255,.85)!important}
.cell-pinyin{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:.92rem;color:var(--gray-8);line-height:1;transition:color .15s}
.cell-tone{font-size:.68rem;font-weight:700;color:var(--pink);margin-top:2px;transition:color .15s}
.cell-hanzi{font-size:.72rem;font-weight:600;color:var(--gray-4);font-family:serif;transition:color .15s}

/* table variant for finals */
.pinyin-table{border-collapse:separate;border-spacing:6px;width:100%;margin-bottom:32px}
.pinyin-table th{
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:.78rem;
  padding:8px 12px;border-radius:12px;text-align:center;
  background:linear-gradient(135deg,var(--pink-ll),var(--purple-l));
  color:var(--gray-6);border:1.5px solid var(--pink-l);white-space:nowrap;
}
.pinyin-table th.row-header{
  background:linear-gradient(135deg,var(--pink),var(--purple));
  color:#fff;box-shadow:0 2px 8px rgba(236,72,153,.3);min-width:52px;
}
.pinyin-table td{padding:3px}
.pinyin-table .cell{width:100%;min-width:64px;height:60px}

/* ── Tone curve diagram ── */
.tone-diagram{
  display:flex;gap:16px;flex-wrap:wrap;
  padding:20px 24px;
  background:rgba(255,255,255,.82);
  border:1.5px solid var(--pink-ll);
  border-radius:20px;
  margin-bottom:24px;
}
.tone-card{
  flex:1;min-width:100px;padding:14px 16px;border-radius:16px;
  border:2px solid;text-align:center;cursor:pointer;transition:all .18s;
}
.tone-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.1)}
.tone-card .t-num{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.4rem}
.tone-card .t-name{font-size:.72rem;font-weight:700;margin:3px 0}
.tone-card .t-ex{font-size:1.1rem;font-weight:800;font-family:'Baloo 2',sans-serif}
.tone-card .t-curve{font-size:.65rem;font-weight:600;opacity:.7;margin-top:2px}

/* ── Playing indicator ── */
@keyframes ripple{0%{transform:scale(.8);opacity:.7}100%{transform:scale(2.2);opacity:0}}
.ripple{
  position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.45),transparent 70%);
  animation:ripple .5s ease-out forwards;
}

/* ── Toast ── */
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);
  background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;
  padding:10px 22px;border-radius:24px;font-weight:800;font-size:.85rem;
  box-shadow:0 6px 24px rgba(236,72,153,.4);z-index:200;
  transition:transform .35s cubic-bezier(.22,1,.36,1);pointer-events:none;
  display:flex;align-items:center;gap:8px;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ── Stats bar ── */
.stats-bar{
  display:flex;gap:10px;flex-wrap:wrap;
  padding:0 32px 20px;max-width:1100px;margin:0 auto;
}
.stat-chip{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;border-radius:20px;
  background:rgba(255,255,255,.85);
  border:1.5px solid;font-size:.8rem;font-weight:800;
}
.stat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── Footer note ── */
.tip{
  padding:0 32px 16px;max-width:1100px;margin:0 auto;
  font-size:.75rem;color:var(--gray-4);font-weight:600;
  display:flex;align-items:center;gap:6px;
}

/* ── No result ── */
.no-result{
  text-align:center;padding:48px 0;color:var(--gray-4);
  font-size:.9rem;font-weight:700;
}
.no-result .emoji{font-size:2.5rem;display:block;margin-bottom:8px}

/* ── Responsive ── */
@media(max-width:640px){
  header{padding:14px 18px}
  .hero,.search-wrap,.tone-legend,.table-wrap,.stats-bar,.tip{padding-left:18px;padding-right:18px}
  .cell{width:60px;height:60px}
  .cell-pinyin{font-size:.8rem}
}
</style>
</head>

<!-- Sakura petals -->

</header>

<!-- Hero -->

  <p>Tap any cell to hear pronunciation · Choose a tone to practise</p>
</div>

<!-- Stats -->
<div class="stats-bar" id="statsBar"></div>

<!-- Search -->
<div class="search-wrap">
  <div class="search-box">

</div>

<!-- Tone cards -->
<div class="stats-bar" style="padding-top:0">
  <div class="tone-diagram" id="toneDiagram"></div>
</div>

<!-- Tip -->
<div class="tip">💡 Tap a cell to hear it • Hold Shift to compare two sounds • A Chinese system voice is required</div>

<!-- Main table -->
<div class="table-wrap" id="tableWrap"></div>

</div><!-- /app -->

<!-- Toast -->
<div class="toast" id="toast">
  <span>🔊</span><span id="toastText"></span>
</div>

/* ============================================================
   TONE MARKS HELPER
   ============================================================ */
function addToneMark(syllable, tone) {
  if (tone === 0) return syllable // neutral, no change
  // Priority: a > e > o > then last of ui/iu
  const order = ['a','e','o','ü','u','i']
  for (const v of order) {
    if (syllable.includes(v)) {
      return syllable.replace(v, TONE_MARKS[v]?.[tone-1] || v)
    }
  }
  return syllable
}

function buildDisplayPinyin(initial, final, tone) {
  const syl = initial === '(zero)' ? final : initial + final
  return addToneMark(syl, tone)
}

/* ============================================================
   WEB SPEECH API
   ============================================================ */
function speak(_syllable, cellEl) {
  cellEl.classList.remove('playing');
  removeRipple(cellEl);
  showToast('Âm thanh Pinyin legacy đã tắt để tránh phát sai. Hãy dùng Pinyin Race Quest với giọng Quan thoại zh-CN.');
}

function addRipple(el) {
  const r = document.createElement('div'); r.className='ripple'; el.appendChild(r)
  r.addEventListener('animationend', ()=>r.remove())
}
function removeRipple(el) { el.querySelectorAll('.ripple').forEach(r=>r.remove()) }

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer = null
function showToast(msg) {
  const t = document.getElementById('toast'), tx = document.getElementById('toastText')
  tx.textContent = msg
  t.classList.add('show')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200)
}

function renderToneButtons() {
  const wrap = document.getElementById('toneButtons')
  wrap.innerHTML = ''
  TONES.forEach(t => {
    const btn = document.createElement('button')
    btn.className = 'btn-tone' + (t.num === selectedTone ? ' active' : '')
    btn.textContent = t.num === 0 ? '·' : `${t.num}声`
    btn.title = t.name
    btn.onclick = () => { selectedTone = t.num; renderAll() }
    wrap.appendChild(btn)
  })
}

function renderToneDiagram() {
  const wrap = document.getElementById('toneDiagram')
  wrap.innerHTML = TONES.map(t=>`
    <div class="tone-card" style="color:${t.color};background:${t.bg};border-color:${t.border}"
         onclick="selectedTone=${t.num};renderAll()">
      <div class="t-num">${t.num===0?'·':t.num+'声'}</div>
      <div class="t-name">${t.name}</div>
      <div class="t-ex">${addToneMark('ma',t.num)}</div>
      <div class="t-curve">${t.curve}</div>
    </div>`).join('')
}

/* ============================================================
   BUILD CELL
   ============================================================ */
function buildCell(key, display) {
  const data = SYLLABLE_MAP[key]
  if (!data) return null

  const [init, fin] = key.split('-')
  const syllable = display || (init==='(zero)' ? fin : init+fin)
  const pinyin = addToneMark(syllable, selectedTone)
  // get example hanzi for this tone
  const hanzi = (data[selectedTone] || data[0] || '')

  const div = document.createElement('div')
  div.className = 'cell'
  div.innerHTML = `
    <div class="cell-pinyin">${pinyin}</div>
    <div class="cell-tone">${selectedTone===0?'轻声':selectedTone+'声'}</div>
    ${hanzi ? `<div class="cell-hanzi">${hanzi}</div>` : ''}
  `
  div.title = `${pinyin} (${key})`
  div.onclick = () => speak(pinyin, div)
  return div
}

   ============================================================ */

  renderToneButtons()
  renderTable()
}

function renderTable() {
  const wrap = document.getElementById('tableWrap')
  wrap.innerHTML = ''
  const q = searchQ.toLowerCase().trim()

  // ── Section 1: Single finals (zero initial) ──
  const s1 = document.createElement('div')
  s1.innerHTML = `
    <div class="section-header">
      <div class="section-icon">🎵</div>
      <div>
        <div class="section-title">Standalone finals</div>
        <div class="section-sub">Syllables without an initial</div>
      </div>
    </div>`
  const grid1 = document.createElement('div')
  grid1.className = 'pinyin-grid'

  const zeroFinals = FINALS_BASIC.concat(['ai','ei','ao','ou','an','en','ang','eng','er','yi','wu'])
  let count1 = 0
  zeroFinals.forEach(f => {
    const key = `(zero)-${f}`
    if (SYLLABLE_MAP[key]) {
      const syl = f
      if (!q || syl.includes(q) || (SYLLABLE_MAP[key][selectedTone]||'').includes(q)) {
        const cell = buildCell(key, syl)
        if (cell) { grid1.appendChild(cell); count1++ }
      }
    }
  })
  if (count1 > 0) { s1.appendChild(grid1); wrap.appendChild(s1) }
  else if (!q) { s1.appendChild(grid1); wrap.appendChild(s1) }

  // ── Section 2: Full table ──
  const s2 = document.createElement('div')
  s2.innerHTML = `
    <div class="section-header" style="margin-top:28px">
      <div class="section-icon">📊</div>
      <div>
        <div class="section-title">Complete Pinyin chart — Initials × Finals</div>
        <div class="section-sub">Tap a cell to hear it · Cell color changes with the selected tone</div>
      </div>
    </div>`

  const SHOW_INITIALS = ['b','p','m','f','d','t','n','l','g','k','h','j','q','x','zh','ch','sh','r','z','c','s','y','w']
  const SHOW_FINALS   = ['a','o','e','i','u','ü','ai','ei','ao','ou','an','en','ang','eng','ie','in','ing','ong','ua','uo','ui','iu','ian','uan','ue']

  const table = document.createElement('table')
  table.className = 'pinyin-table'

  // header row
  const thead = document.createElement('tr')
  thead.innerHTML = '<th>声母 \\ 韵母</th>' +
    SHOW_FINALS.map(f=>`<th>${f}</th>`).join('')
  table.appendChild(thead)

  let totalVisible = 0
  SHOW_INITIALS.forEach(init => {
    const tr = document.createElement('tr')
    const th = document.createElement('th')
    th.className = 'row-header'
    th.textContent = init
    tr.appendChild(th)

    let rowHasVisible = false
    SHOW_FINALS.forEach(fin => {
      const td = document.createElement('td')
      const key = `${init}-${fin}`
      if (SYLLABLE_MAP[key]) {
        const syl = init + fin
        if (!q || syl.includes(q) || (SYLLABLE_MAP[key][selectedTone]||'').includes(q)) {
          const cell = buildCell(key, syl)
          if (cell) { td.appendChild(cell); rowHasVisible = true; totalVisible++ }
        } else {
          td.innerHTML = '<div class="cell" style="opacity:.18;cursor:default"></div>'
        }
      } else {
        // empty invalid combination
        td.innerHTML = '<div style="width:100%;height:56px;border-radius:12px;background:rgba(0,0,0,.025)"></div>'
      }
      tr.appendChild(td)
    })
    table.appendChild(tr)
  })

  s2.appendChild(table)

  if (totalVisible === 0 && q) {
    s2.innerHTML += `<div class="no-result"><span class="emoji">🔍</span>No syllable found "<strong>${q}</strong>"</div>`
  }
  wrap.appendChild(s2)
}

/* ============================================================

   ============================================================ */
function createPetals() {
  const container = document.getElementById('petals')
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div')
    p.className = 'petal'
    const size = 16 + Math.random() * 20
    const dur  = 7 + Math.random() * 9
    const del  = Math.random() * 15
    const drift= (Math.random()-0.5)*200
    const spin = 180 + Math.random()*400
    const sway = (Math.random()-0.5)*60
    p.style.cssText = `
      left:${Math.random()*100}%;
      width:${size}px;height:${size}px;
      --dur:${dur}s;--delay:${del}s;
      --drift:${drift}px;--spin:${spin}deg;--sway:${sway}px;
      opacity:${.5+Math.random()*.45};
    `
    p.innerHTML = `<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      ${[0,72,144,216,288].map(a=>{
        const cx = 20 + 9*Math.cos((a-90)*Math.PI/180)
        const cy = 20 + 9*Math.sin((a-90)*Math.PI/180)
        return `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="7.5" ry="5"
          transform="rotate(${a} ${cx.toFixed(1)} ${cy.toFixed(1)})"
          fill="#fda4af" opacity="0.88"/>`
      }).join('')}
      <circle cx="20" cy="20" r="4" fill="#fb7185"/>
      <circle cx="20" cy="20" r="2" fill="#fecdd3"/>
    </svg>`
    container.appendChild(p)
  }
}
